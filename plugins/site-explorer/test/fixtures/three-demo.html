<!doctype html><html><head><meta charset="utf-8"><title>Three demo</title>
<script type="importmap">{"imports":{"three":"/three.module.js"}}</script>
<style>body{margin:0;background:#0b0b12;color:#fff;font-family:system-ui}section{padding:40px}canvas{display:block;width:640px;height:400px}video{width:320px;height:180px}</style></head>
<body><section><h2>Our product in 3D</h2><div id="stage"></div></section>
<section><h2>Watch the reel</h2><video id="reel" src="/clip.webm" muted loop autoplay playsinline controls></video></section>
<script type="module">
import * as THREE from 'three';
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(640, 400); stage.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x101826);
const camera = new THREE.PerspectiveCamera(50, 640 / 400, 0.1, 100); camera.position.set(0, 0.5, 4);
scene.add(new THREE.DirectionalLight(0xffffff, 2).translateX(2).translateY(3), new THREE.AmbientLight(0x6688ff, 0.6));
const cube = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), new THREE.MeshStandardMaterial({ color: 0xff6633, metalness: 0.3, roughness: 0.4 }));
const ring = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.05, 16, 64), new THREE.MeshBasicMaterial({ color: 0x66ccff }));
cube.name = 'ProductCube'; ring.name = 'HaloRing'; scene.add(cube, ring);
(function loop(){ cube.rotation.y += 0.02; cube.rotation.x += 0.01; ring.rotation.z += 0.015; renderer.render(scene, camera); requestAnimationFrame(loop); })();
</script></body></html>
