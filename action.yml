name: site-explorer
description: Health-check a deployed or preview website on every pull request, compare it with production, and comment the result. Fails the job when your gate is not met.
author: rocksk8
branding: { icon: search, color: purple }
inputs:
  url: { description: 'Site (or preview deployment) to check', required: true }
  baseline-url: { description: 'Optional production URL: adds a before/after comparison to the comment', required: false, default: '' }
  max-pages: { description: 'Pages to crawl (1-50)', required: false, default: '6' }
  fail-on: { description: 'Fail when an issue of this severity or worse exists: critical, high, medium or low. Empty = never fail on severity', required: false, default: 'high' }
  min-health: { description: 'Fail when the health score (0-100) is below this. Empty = no minimum', required: false, default: '' }
  comment: { description: 'Post / update a comment on the pull request', required: false, default: 'true' }
  github-token: { description: 'Token used to post the comment', required: false, default: '${{ github.token }}' }
outputs:
  score: { description: 'Health score 0-100', value: '${{ steps.run.outputs.score }}' }
  verdict: { description: 'pass, conditional or fail', value: '${{ steps.run.outputs.verdict }}' }
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with: { node-version: 22 }
    - name: Install
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm install --omit=dev --no-audit --no-fund --loglevel=error
    - name: Find a browser
      shell: bash
      run: |
        for c in "${CHROMIUM_PATH:-}" "$(command -v google-chrome || true)" "$(command -v chromium || true)" "$(command -v chromium-browser || true)"; do
          if [ -n "$c" ] && [ -x "$c" ]; then echo "CHROMIUM_PATH=$c" >> "$GITHUB_ENV"; exit 0; fi
        done
        echo "No Chrome on this runner; downloading Chromium"
        npx --prefix "${{ github.action_path }}" playwright-core install --with-deps chromium
    - name: Explore
      id: run
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_BASELINE_URL: ${{ inputs.baseline-url }}
        INPUT_MAX_PAGES: ${{ inputs.max-pages }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_MIN_HEALTH: ${{ inputs.min-health }}
        INPUT_OUT: ${{ runner.temp }}/site-explorer-out
        INPUT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: node "${{ github.action_path }}/plugins/site-explorer/scripts/ci-run.mjs"
    - name: Comment on the pull request
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request' && steps.run.outputs.comment-file != ''
      continue-on-error: true # forks get a read-only token; the result is still in the job summary
      uses: actions/github-script@v7
      env: { COMMENT_FILE: '${{ steps.run.outputs.comment-file }}' }
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const body = fs.readFileSync(process.env.COMMENT_FILE, 'utf8');
          const marker = '<!-- site-explorer-pr-comment -->';
          const { owner, repo } = context.repo, issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          const mine = comments.find((c) => c.body && c.body.startsWith(marker) && c.user.type === 'Bot');
          if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
          else await github.rest.issues.createComment({ owner, repo, issue_number, body });
    - name: Keep the dashboard and AI handoff
      if: always() && steps.run.outputs.out-dir != ''
      uses: actions/upload-artifact@v4
      with:
        name: site-explorer
        path: |
          ${{ steps.run.outputs.out-dir }}/current/dashboard.html
          ${{ steps.run.outputs.out-dir }}/current/handoff
          ${{ steps.run.outputs.out-dir }}/changes.md
        if-no-files-found: ignore
    - name: Apply the gate
      if: always() && steps.run.outputs.failed == 'true'
      shell: bash
      run: echo "::error::site-explorer gate not met - see the comment or the job summary"; exit 1
