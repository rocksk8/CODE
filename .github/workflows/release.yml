# Publishes to npm when a version tag is pushed (v0.4.0 …). Needs the repo secret NPM_TOKEN (npm → Access Tokens → Automation).
name: release
on:
  push:
    tags: ['v*']
permissions: { contents: write, id-token: write }
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      - name: Tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm install --omit=dev --no-audit --no-fund
      - run: npm publish --provenance --access public
        env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}' }
      - uses: softprops/action-gh-release@v2
        with: { generate_release_notes: true }
