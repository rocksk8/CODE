name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [22] }
    defaults:
      run:
        working-directory: plugins/site-explorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm, cache-dependency-path: plugins/site-explorer/package-lock.json }
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
