# Example (and self-test) of using this repository as an Action. Manual only: it needs a reachable URL.
name: example-action
on:
  workflow_dispatch:
    inputs:
      url: { description: 'Site to check', required: true }
permissions: { contents: read, pull-requests: write }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          url: ${{ inputs.url }}
          fail-on: high
