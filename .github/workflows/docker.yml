# Builds the image on every PR that touches it (so it cannot rot) and publishes ghcr.io/<owner>/site-explorer on version tags.
name: docker
on:
  pull_request: { paths: ['Dockerfile', '.dockerignore', 'plugins/site-explorer/scripts/**', 'package.json'] }
  push: { tags: ['v*'] }
permissions: { contents: read }
jobs:
  image:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write } # packages: write is only used when a version tag is pushed
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        uses: docker/metadata-action@v5
        with: { images: 'ghcr.io/${{ github.repository_owner }}/site-explorer', tags: 'type=semver,pattern={{version}}' }
      - uses: docker/build-push-action@v6
        with: { context: ., push: "${{ startsWith(github.ref, 'refs/tags/') }}", tags: '${{ steps.meta.outputs.tags }}', cache-from: type=gha, cache-to: 'type=gha,mode=max' }
